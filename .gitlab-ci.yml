variables:
  RELEASE: "25.08"

default:
  image: "freedesktopsdk/sdk:${RELEASE}"
  interruptible: true
  timeout: 1h
  retry:
    max: 2
    when: runner_system_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - lint
  - build

.build_template:
  stage: build
  script:
  - meson setup _build-dir
  - meson dist -C _build-dir

lint:
  stage: lint
  needs: []
  image: "registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:latest"
  script:
    - ruff format --check
    - ruff check

build_x86_64:
  extends:
  - .build_template
  tags:
  - x86_64
  variables:
    ARCH: x86_64

build_i686:
  extends:
  - .build_template
  tags:
  - x86_64
  variables:
    ARCH: i686

build_aarch64:
  extends:
  - .build_template
  tags:
  - aarch64
  variables:
    ARCH: aarch64
