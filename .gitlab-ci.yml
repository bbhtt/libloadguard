image: gcc:8.2

stages:
  - build


.build_template: &build_definition
  stage: build
  script:
    - apt update && apt install -y meson
    - meson --werror
            _build
    - ninja -v -C _build
    - ninja -C _build install
  artifacts:
    name: "slg-${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}"
    when: always
    paths:
      - "_build/config.h"
      - "_build/meson-logs"

build_x86_64:
  <<: *build_definition
  tags:
    - x86_64

build_i686:
  <<: *build_definition
  tags:
    - x86_64

build_aarch64:
  <<: *build_definition
  tags:
    - aarch64

build_arm:
  <<: *build_definition
  tags:
    - armhf
