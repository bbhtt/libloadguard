variables:
  IMAGE_ID: 'a12453fe83ee8ab60e2f92ec6aa151a3a588f11b'
  # Docker Images
  DOCKER_REGISTRY: "registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images"
  DOCKER_AMD64: "${DOCKER_REGISTRY}/amd64:${IMAGE_ID}"
  DOCKER_AARCH64: "${DOCKER_REGISTRY}/arm64:${IMAGE_ID}"
  DOCKER_POWERPC64LE: "${DOCKER_REGISTRY}/ppc64le:${IMAGE_ID}"

  XDG_CACHE_HOME: "${CI_PROJECT_DIR}/cache"

stages:
  - build

.build_template: &build_definition
  stage: build
  script:
    - bst build shared-library-guard.bst
  artifacts:
    when: always
    paths:
      - ${CI_PROJECT_DIR}/cache/buildstream/logs

build_x86_64:
  <<: *build_definition
  image: $DOCKER_AMD64
  tags:
    - x86_64

build_i686:
  <<: *build_definition
  image: $DOCKER_AMD64
  tags:
    - x86_64

build_aarch64:
  <<: *build_definition
  image: $DOCKER_AARCH64
  tags:
    - aarch64

build_arm:
  <<: *build_definition
  image: $DOCKER_AARCH64
  tags:
    - armhf
